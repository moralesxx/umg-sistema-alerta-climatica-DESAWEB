server:
  port: 8080
  shutdown: graceful            # cierre ordenado ante SIGTERM (Kubernetes)
spring:
  application.name: alert-service
  lifecycle.timeout-per-shutdown-phase: 25s
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://alert-db:5432/alert_db}
    username: ${DATABASE_USER:alert}
    password: ${DATABASE_PASSWORD:}
    hikari: { maximum-pool-size: 10, initialization-fail-timeout: -1 }
  jpa:
    open-in-view: false
    hibernate.ddl-auto: ${DB_DDL_AUTO:update}
    properties.hibernate.jdbc.time_zone: UTC
  jackson:
    default-property-inclusion: always
    serialization.write-dates-as-timestamps: false
management:
  endpoints.web.exposure.include: health
  endpoint.health.probes.enabled: true
app:
  jwt:
    key: ${JWT_KEY:}
    issuer: ${JWT_ISSUER:AlertaClimatica.Auth}
    audience: ${JWT_AUDIENCE:AlertaClimatica.Client}
  services:
    community: ${COMMUNITY_SERVICE_URL:http://community-service:8080}
    sensor: ${SENSOR_SERVICE_URL:http://sensor-service:8080}
    audit: ${AUDIT_SERVICE_URL:http://audit-service:8000}
  tz: ${APP_TZ:America/Guatemala}
  seed-demo: ${SEED_DEMO:false}
