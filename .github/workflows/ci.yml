name: CI
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    strategy: { matrix: { svc: [audit-service, report-service] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - run: pip install -r services/${{ matrix.svc }}/requirements.txt
      - run: cd services/${{ matrix.svc }} && pytest -q
  auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: cd services/auth-service && npm ci && npm test && npm run build
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: |
          for p in gateway community-service sensor-service; do
            dotnet build services/$p/*.csproj -c Release
          done
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: cd services/alert-service && mvn -B test
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: cd frontend/angular-app && npm ci && npx ng build --configuration production
