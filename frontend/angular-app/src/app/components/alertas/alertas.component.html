<div class="row g-2 mb-2">
  <div class="col-12">
    <div class="card shadow-sm border-0">
      <div class="card-body py-3">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h5 class="card-title fw-bold mb-0">Alertas en Tiempo Real</h5>
          <button class="btn btn-outline-secondary btn-sm rounded-pill px-2 py-0" (click)="onLimpiarHistorial()">Limpiar</button>
        </div>
        <button class="btn btn-primary w-100 py-1 fw-bold shadow-sm mb-2" (click)="onSimularAlerta()" style="font-size: 0.85rem;">
          SIMULAR ALERTA ({{ nivelAlertaGlobal }})
        </button>
        <div class="alert-feed">
          <div *ngFor="let alerta of alertasRecientes" class="card border-0 bg-light p-2 mb-2 shadow-sm">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <span class="badge" [ngClass]="getBadgeClass($any(alerta).nivelRiesgo || $any(alerta).nivel || $any(alerta).nivelAlerta || $any(alerta).mensaje)" style="font-size: 0.7rem;">
                {{ $any(alerta).nivelRiesgo || $any(alerta).nivel || $any(alerta).nivelAlerta || 'Alerta' }}
              </span>
              <small class="text-muted" style="font-size: 0.7rem;">
                {{ $any(alerta).fechaEmision || $any(alerta).fechaHora | date:'shortTime' }}
              </small>
            </div>
            <p class="mb-0 text-dark" style="font-size: 0.8rem;">{{ $any(alerta).mensaje }}</p>
          </div>
          <div *ngIf="alertasRecientes.length === 0" class="text-center text-muted py-2">
            <small>No hay alertas recientes.</small>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
