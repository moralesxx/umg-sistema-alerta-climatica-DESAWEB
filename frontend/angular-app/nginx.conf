# Nginx DENTRO del contenedor del frontend (Angular + proxy hacia la API).
# El HTTPS lo termina el Nginx "de borde" (ver deploy/nginx-edge.conf.example):
# este archivo solo habla HTTP dentro de la red interna de Docker.

# Si ya viene X-Forwarded-Proto desde el Nginx de borde (https) se respeta;
# si el contenedor se abre directo (sin borde) se usa el esquema local.
map $http_x_forwarded_proto $proto_real {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# IP real del cliente: se confía en X-Forwarded-For SOLO si viene de una red privada
# (Nginx de borde / red de Docker). Sin esto, detrás del borde todos los usuarios
# compartirían una IP y el límite de solicitudes del gateway se aplicaría a todos juntos.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80;
    server_name _;

    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker: resuelve "backend" en cada peticion, asi nginx
    # arranca aunque la API todavia no este levantada.
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 2m;
    proxy_buffering on;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # La política CSP (solo scripts/estilos propios, sin CDN) se agrega en las respuestas HTML (index.html y rutas de la SPA).
    # Si una pantalla dejara de verse bien tras un cambio, revise la consola del navegador (Content-Security-Policy).
    # Cabeceras de seguridad basicas (se repiten en cada location que use add_header,
    # porque nginx no hereda add_header cuando el location define los suyos).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Proxy inverso hacia el API Gateway (YARP). El navegador llama a /api/... en el
    # mismo origen del frontend: no hace falta CORS ni exponer el puerto 5081.
    location /api/ {
        set $backend http://gateway:8080;
        proxy_pass $backend;

        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;   # ya es la IP real (realip) y no se puede falsificar
        proxy_set_header X-Forwarded-Proto $proto_real;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;

        # Las respuestas de la API (token, datos) nunca deben quedar en cache.
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Healthcheck de la API a traves del proxy (para monitoreo externo).
    location = /health {
        set $backend http://gateway:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # index.html jamas se cachea: asi un despliegue nuevo se ve de inmediato.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Archivos estaticos de Angular (nombre con hash => cache largo). Si falta uno,
    # 404 real (no index.html), para no entregar HTML donde el navegador espera JS.
    location ~* \.(?:js|css|woff2?|ttf|png|jpe?g|gif|svg|ico|webp)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Angular (SPA): cualquier otra ruta devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
