# K3s incluye Traefik. TLS con cert-manager (ClusterIssuer "letsencrypt") o un Secret TLS propio.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alerta
  namespace: alerta-climatica
  annotations: { cert-manager.io/cluster-issuer: letsencrypt }
spec:
  tls: [{ hosts: [sistema-climatico.example], secretName: alerta-tls }]
  rules:
    - host: sistema-climatico.example
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: frontend, port: { number: 80 } } } }
