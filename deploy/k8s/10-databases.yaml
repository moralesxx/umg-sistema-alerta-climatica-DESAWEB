apiVersion: apps/v1
kind: StatefulSet
metadata: { name: auth-db, namespace: alerta-climatica }
spec:
  serviceName: auth-db
  replicas: 1
  selector: { matchLabels: { app: auth-db } }
  template:
    metadata: { labels: { app: auth-db } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_DB, value: auth_db }
            - { name: POSTGRES_USER, value: auth }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: app-secrets, key: AUTH_DB_PASSWORD } } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          readinessProbe: { exec: { command: ["pg_isready","-U","auth","-d","auth_db"] }, periodSeconds: 5 }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: ["ReadWriteOnce"], resources: { requests: { storage: 2Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: auth-db, namespace: alerta-climatica }
spec: { selector: { app: auth-db }, ports: [{ port: 5432 }] }
---
