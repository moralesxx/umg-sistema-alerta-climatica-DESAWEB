apiVersion: apps/v1
kind: StatefulSet
metadata: { name: sensor-db, namespace: alerta-climatica }
spec:
  serviceName: sensor-db
  replicas: 1
  selector: { matchLabels: { app: sensor-db } }
  template:
    metadata: { labels: { app: sensor-db } }
    spec:
      containers:
        - name: mssql
          image: mcr.microsoft.com/mssql/server:2022-latest
          env:
            - { name: ACCEPT_EULA, value: "Y" }
            - { name: MSSQL_SA_PASSWORD, valueFrom: { secretKeyRef: { name: app-secrets, key: SA_PASSWORD } } }
          ports: [{ containerPort: 1433 }]
          resources: { requests: { memory: 2Gi } }
          readinessProbe: { tcpSocket: { port: 1433 }, initialDelaySeconds: 20, periodSeconds: 10 }
          volumeMounts: [{ name: data, mountPath: /var/opt/mssql }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: ["ReadWriteOnce"], resources: { requests: { storage: 5Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: sensor-db, namespace: alerta-climatica }
spec: { selector: { app: sensor-db }, ports: [{ port: 1433 }] }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: mongo, namespace: alerta-climatica }
spec:
  serviceName: mongo
  replicas: 1
  selector: { matchLabels: { app: mongo } }
  template:
    metadata: { labels: { app: mongo } }
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports: [{ containerPort: 27017 }]
          readinessProbe: { exec: { command: ["mongosh","--quiet","--eval","db.adminCommand('ping').ok"] }, periodSeconds: 10 }
          volumeMounts: [{ name: data, mountPath: /data/db }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: ["ReadWriteOnce"], resources: { requests: { storage: 5Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: mongo, namespace: alerta-climatica }
spec: { selector: { app: mongo }, ports: [{ port: 27017 }] }
