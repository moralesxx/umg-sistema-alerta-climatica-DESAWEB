apiVersion: apps/v1
kind: Deployment
metadata: { name: gateway, namespace: alerta-climatica }
spec:
  replicas: 2
  selector: { matchLabels: { app: gateway } }
  template:
    metadata: { labels: { app: gateway } }
    spec:
      terminationGracePeriodSeconds: 30        # graceful shutdown
      containers:
        - name: gateway
          image: REGISTRY/alerta/gateway:latest
          ports: [{ containerPort: 8080 }]
          env:
            - { name: Jwt__Key, valueFrom: { secretKeyRef: { name: app-secrets, key: JWT_KEY } } }
            - { name: Jwt__Issuer, valueFrom: { configMapKeyRef: { name: app-config, key: JWT_ISSUER } } }
            - { name: Jwt__Audience, valueFrom: { configMapKeyRef: { name: app-config, key: JWT_AUDIENCE } } }
            - { name: Cors__AllowedOrigins__0, valueFrom: { configMapKeyRef: { name: app-config, key: PUBLIC_URL } } }
            - { name: APP_TZ, valueFrom: { configMapKeyRef: { name: app-config, key: APP_TZ } } }
          readinessProbe: { httpGet: { path: /health, port: 8080 }, initialDelaySeconds: 10, periodSeconds: 10, failureThreshold: 6 }
          livenessProbe:  { httpGet: { path: /health, port: 8080 }, initialDelaySeconds: 40, periodSeconds: 20 }
          resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { memory: 768Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: gateway, namespace: alerta-climatica }
spec: { selector: { app: gateway }, ports: [{ port: 8080, targetPort: 8080 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: auth-service, namespace: alerta-climatica }
spec:
  replicas: 2
  selector: { matchLabels: { app: auth-service } }
  template:
    metadata: { labels: { app: auth-service } }
    spec:
      terminationGracePeriodSeconds: 30        # graceful shutdown
      containers:
        - name: auth-service
          image: REGISTRY/alerta/auth-service:latest
          ports: [{ containerPort: 8080 }]
          env:
            - { name: JWT_KEY, valueFrom: { secretKeyRef: { name: app-secrets, key: JWT_KEY } } }
            - { name: JWT_ISSUER, valueFrom: { configMapKeyRef: { name: app-config, key: JWT_ISSUER } } }
            - { name: JWT_AUDIENCE, valueFrom: { configMapKeyRef: { name: app-config, key: JWT_AUDIENCE } } }
            - { name: DATABASE_URL, value: "postgres://auth:$(AUTH_DB_PASSWORD)@auth-db:5432/auth_db" }
            - { name: AUTH_DB_PASSWORD, valueFrom: { secretKeyRef: { name: app-secrets, key: AUTH_DB_PASSWORD } } }
            - { name: ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: app-secrets, key: ADMIN_PASSWORD } } }
            - { name: AUDIT_SERVICE_URL, value: "http://audit-service:8000" }
          readinessProbe: { httpGet: { path: /health, port: 8080 }, initialDelaySeconds: 10, periodSeconds: 10, failureThreshold: 6 }
          livenessProbe:  { httpGet: { path: /health, port: 8080 }, initialDelaySeconds: 40, periodSeconds: 20 }
          resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { memory: 768Mi } }
---
