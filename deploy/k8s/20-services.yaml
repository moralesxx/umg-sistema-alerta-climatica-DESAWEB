apiVersion: apps/v1
kind: Deployment
metadata: { name: alert-service, namespace: alerta-climatica }
spec:
  replicas: 2
  selector: { matchLabels: { app: alert-service } }
  template:
    metadata: { labels: { app: alert-service } }
    spec:
      terminationGracePeriodSeconds: 30        # graceful shutdown
      containers:
        - name: alert-service
          image: REGISTRY/alerta/alert-service:latest
          ports: [{ containerPort: 8080 }]
          env:
            - { name: JWT_KEY, valueFrom: { secretKeyRef: { name: app-secrets, key: JWT_KEY } } }
            - { name: JWT_ISSUER, valueFrom: { configMapKeyRef: { name: app-config, key: JWT_ISSUER } } }
            - { name: JWT_AUDIENCE, valueFrom: { configMapKeyRef: { name: app-config, key: JWT_AUDIENCE } } }
            - { name: DATABASE_URL, value: "jdbc:postgresql://alert-db:5432/alert_db" }
            - { name: DATABASE_USER, value: "alert" }
            - { name: DATABASE_PASSWORD, valueFrom: { secretKeyRef: { name: app-secrets, key: ALERT_DB_PASSWORD } } }
            - { name: COMMUNITY_SERVICE_URL, value: "http://community-service:8080" }
            - { name: SENSOR_SERVICE_URL, value: "http://sensor-service:8080" }
            - { name: AUDIT_SERVICE_URL, value: "http://audit-service:8000" }
            - { name: SEED_DEMO, valueFrom: { configMapKeyRef: { name: app-config, key: SEED_DEMO } } }
            - { name: APP_TZ, valueFrom: { configMapKeyRef: { name: app-config, key: APP_TZ } } }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8080 }, initialDelaySeconds: 10, periodSeconds: 10, failureThreshold: 6 }
          livenessProbe:  { httpGet: { path: /actuator/health/liveness, port: 8080 }, initialDelaySeconds: 40, periodSeconds: 20 }
          resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { memory: 768Mi } }
---
