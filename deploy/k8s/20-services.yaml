apiVersion: apps/v1
kind: Deployment
metadata: { name: sensor-service, namespace: alerta-climatica }
spec:
  replicas: 1
  # Sensor Service ejecuta el simulador: mantenga 1 réplica o deshabilite Simulador__Habilitado en las demás.
  selector: { matchLabels: { app: sensor-service } }
  template:
    metadata: { labels: { app: sensor-service } }
    spec:
      terminationGracePeriodSeconds: 30        # graceful shutdown
      containers:
        - name: sensor-service
          image: REGISTRY/alerta/sensor-service:latest
          ports: [{ containerPort: 8080 }]
          env:
            - { name: Jwt__Key, valueFrom: { secretKeyRef: { name: app-secrets, key: JWT_KEY } } }
            - { name: Jwt__Issuer, valueFrom: { configMapKeyRef: { name: app-config, key: JWT_ISSUER } } }
            - { name: Jwt__Audience, valueFrom: { configMapKeyRef: { name: app-config, key: JWT_AUDIENCE } } }
            - { name: SA_PASSWORD, valueFrom: { secretKeyRef: { name: app-secrets, key: SA_PASSWORD } } }
            - { name: ConnectionStrings__Default, value: "Server=sensor-db;Database=SensorDb;User Id=sa;Password=$(SA_PASSWORD);TrustServerCertificate=True;" }
            - { name: Services__Community, value: "http://community-service:8080" }
            - { name: Services__Alert, value: "http://alert-service:8080" }
            - { name: Services__Audit, value: "http://audit-service:8000" }
            - { name: Seed__Demo, valueFrom: { configMapKeyRef: { name: app-config, key: SEED_DEMO } } }
            - { name: APP_TZ, valueFrom: { configMapKeyRef: { name: app-config, key: APP_TZ } } }
          readinessProbe: { httpGet: { path: /health, port: 8080 }, initialDelaySeconds: 10, periodSeconds: 10, failureThreshold: 6 }
          livenessProbe:  { httpGet: { path: /health, port: 8080 }, initialDelaySeconds: 40, periodSeconds: 20 }
          resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { memory: 768Mi } }
