apiVersion: apps/v1
kind: Deployment
metadata: { name: gateway, namespace: alerta-climatica }
spec:
  replicas: 1
  selector: { matchLabels: { app: gateway } }
  template:
    metadata: { labels: { app: gateway, tier: backend } }
    spec:
      terminationGracePeriodSeconds: 30        # cierre ordenado (graceful shutdown)
      securityContext: { runAsNonRoot: true, runAsUser: 1654, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: gateway
          image: alerta/gateway:latest          # kustomization.yaml reemplaza nombre y etiqueta de la imagen
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          env:
            - { name: Jwt__Key, valueFrom: { secretKeyRef: { name: app-secrets, key: JWT_KEY } } }
            - { name: Jwt__Issuer, valueFrom: { configMapKeyRef: { name: app-config, key: JWT_ISSUER } } }
            - { name: Jwt__Audience, valueFrom: { configMapKeyRef: { name: app-config, key: JWT_AUDIENCE } } }
            - { name: Cors__AllowedOrigins__0, valueFrom: { configMapKeyRef: { name: app-config, key: PUBLIC_URL } } }
            - { name: APP_TZ, valueFrom: { configMapKeyRef: { name: app-config, key: APP_TZ } } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          lifecycle: { preStop: { exec: { command: ["sleep", "5"] } } }   # da tiempo a retirar el pod del balanceador
          readinessProbe: { httpGet: { path: /health, port: 8080 }, initialDelaySeconds: 10, periodSeconds: 10, failureThreshold: 12 }
          livenessProbe:  { httpGet: { path: /health, port: 8080 }, initialDelaySeconds: 60, periodSeconds: 20, failureThreshold: 5 }
          resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { memory: 384Mi } }
